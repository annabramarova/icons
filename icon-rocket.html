    <style type="text/css">
      body {
        margin: 0;
        padding: 40px 0;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100svh;
        font-family: Tahoma, sans-serif;
      }
      .wrap {
        position: relative;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .icon {
        cursor: pointer;
        width: 56px;
      }

      .rocket {
        fill: linear-gradient(9deg, #05a595 0%, rgba(255, 255, 255, 0.49) 100%);
      }

      .rocket2 {
        display: none;
      }

      .circle-group {
        transform-origin: center;
        animation: none;
        transition: all 1s ease-in-out;
         transform: rotate(80deg);
      }

      .icon:hover .circle-group {
        transform: rotate(400deg);
      }

      .icon:hover .rocket {
        animation: rocket-takeoff 1.5s ease-in-out forwards;
      }

      .icon:hover .rocket-tail {
        animation: rocket-tail 2s ease-in-out forwards;
      }

      .icon:hover .rocket2 {
        animation: rocket-arrival 2s ease-in-out forwards;
        display: block;
      }

      @keyframes rocket-takeoff {
        0% {
          transform: translate(22px, 22px);
        }
        50% {
          transform: translate(15px, 27px);
        }
        100% {
          transform: translate(100vh, -100vh);
        }
      }

      @keyframes rocket-tail {
        0% {
          transform: translate(23px, 41px);
        }
        50% {
          transform: translate(-100vh, 100vh);
        }
        100% {
          transform: translate(23px, 41px);
        }
      }

      @keyframes rocket-arrival {
        0% {
          transform: translate(-100vh, 100vh);
        }
        100% {
          transform: translate(22px, 22px);
        }
      }
    </style>
